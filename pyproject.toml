[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "ssec_project"
dynamic = ["version"]
description = "Python project repository template for developing python package."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Lower bounds are set at the first release free of all known advisories
# (checked against OSV, 2026-11-18). Raise them when new advisories land.
dependencies = [
    "requests>=2.33.0", # GHSA-gc5v-m9x4-r6x2, GHSA-9hjg-9r4m-mvj7
    "pandas>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-xdist>=3.8",
    "pytest-mock>=3.15",
]
dev = [
    "ssec_project[test]",
    "pre-commit>=4.3",
]
docs = [
    # Jupyter Book 2 is a rewrite on mystmd; the Sphinx-based build used by
    # .readthedocs.yml (`jupyter-book config sphinx`) requires the 1.x series.
    "jupyter-book>=1.0.4,<2",
    "sphinx-rtd-theme>=3.0",
    "sphinx-automodapi>=0.20",
    "sphinx-design>=0.6", # replaces the unmaintained sphinx-panels
    "sphinxcontrib-mermaid>=1.0",
    "numpydoc>=1.9",
]
all = ["ssec_project[dev,docs]"]

[project.urls]
Homepage = "https://github.com/uw-ssec/python-project-template"
Documentation = "https://ssec-python-project-template.readthedocs.io"
Repository = "https://github.com/uw-ssec/python-project-template.git"
Issues = "https://github.com/uw-ssec/python-project-template/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ssec_project/version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/pixi.lock"]

# ---------------------------------------------------------------------------
# Pixi: reproducible, lockfile-backed environments (https://pixi.sh)
#
# Each optional-dependency group above (test, dev, docs, all) is picked up
# automatically by pixi as a feature of the same name. Conda-forge provides
# Python and the compiled scientific stack; everything else comes from PyPI.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
requires-pixi = ">=0.60"

[tool.pixi.dependencies]
python = ">=3.11"
requests = ">=2.33.0"
pandas = ">=3.0"

[tool.pixi.pypi-dependencies]
ssec_project = { path = ".", editable = true }

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", description = "Run the test suite" }
test-cov = { cmd = "pytest --cov=ssec_project --cov-report=term --cov-report=xml", description = "Run the test suite with coverage" }

[tool.pixi.feature.dev.tasks]
lint = { cmd = "pre-commit run --all-files --show-diff-on-failure", description = "Run all pre-commit hooks" }
pre-commit-install = { cmd = "pre-commit install", description = "Install the git pre-commit hook" }

[tool.pixi.feature.docs.tasks]
docs = { cmd = "jupyter-book build docs", description = "Build the Jupyter Book documentation" }

[tool.pixi.feature.build.dependencies]
python-build = ">=1.3"

[tool.pixi.feature.build.tasks]
clean-dist = { cmd = "python -c \"import shutil; shutil.rmtree('dist', ignore_errors=True)\"", description = "Remove previous build artifacts" }
build = { cmd = "python -m build", depends-on = ["clean-dist"], description = "Build the sdist and wheel" }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py315.dependencies]
python = "3.15.*"

[tool.pixi.environments]
default = { features = ["test", "dev"], solve-group = "default" }
# Matches the Python version used by .readthedocs.yml
docs = ["docs", "py313"]
build = { features = ["build"], no-default-feature = true }
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
py315 = ["py315", "test"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-vvv", "-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = false
filterwarnings = ["error"]
log_level = "INFO"
log_cli_level = "INFO"
testpaths = ["tests"]

[tool.repo-review]
ignore = [
    "PP006",  # dev tools are kept as extras so `pip install .[dev]` and RTD keep working
    "SEC001", # zizmor runs via .github/workflows/zizmor.yml (org-managed workflow)
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "ssec_project.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
exclude = ["tests/**", "testing.py"]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "I",   # isort
    "ARG", # flake8-unused-arguments
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "EXE", # flake8-executable
    "NPY", # NumPy specific rules
    "PD",  # pandas-vet
]
ignore = [
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
    "ISC001",  # Conflicts with formatter
]
isort.required-imports = ["from __future__ import annotations"]
# Uncomment if using a _compat.typing backport
# typing-modules = ["{{ cookiecutter.__project_slug }}._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
